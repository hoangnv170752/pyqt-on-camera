[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-camtouch"
version = "0.1.0"
description = "A PyQt6 desktop application for streaming video, multi-camera viewing, and video analysis with local data storage."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PC CamTouch Team"}
]
keywords = [
    "pyqt6",
    "camera",
    "video",
    "rtsp",
    "multi-camera",
    "vlc",
    "video-analysis",
    "cctv"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.5.0",
    "python-vlc>=3.0.18",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
advanced = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/hoangnv170752/pyqt-on-camera"
Repository = "https://github.com/hoangnv170752/pyqt-on-camera"
Documentation = "https://github.com/hoangnv170752/pyqt-on-camera/tree/main/docs"
Issues = "https://github.com/hoangnv170752/pyqt-on-camera/issues"

[project.scripts]
pc-camtouch = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | data
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", ".venv", "venv", "__pycache__", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
